<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Tower Importação Distac</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}
body{
    background:#0f172a;
    color:#fff;
}
header{
    padding:25px;
    background:#111827;
    border-bottom:1px solid #374151;
}
h1{
    font-size:28px;
}
.subtitle{
    color:#94a3b8;
    margin-top:5px;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    box-shadow:0 0 15px rgba(0,0,0,.25);
}
.card h2{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:10px;
}
.card p{
    font-size:30px;
    font-weight:bold;
}
.section{
    padding:20px;
}
.box{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    overflow:auto;
}
input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    background:#0f172a;
    color:white;
}
table{
    width:100%;
    border-collapse:collapse;
}
th{
    background:#334155;
    padding:10px;
    text-align:left;
}
td{
    padding:10px;
    border-bottom:1px solid #334155;
}
footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}
</style>
</head>

<body>

<header>
<h1>🚢 Control Tower Importação Distac</h1>
<p class="subtitle">
Monitoramento operacional de embarques e itens previstos
</p>
</header>

<div class="cards">

<div class="card">
<h2>Itens Previstos</h2>
<p id="itensPrevistos">0</p>
</div>

<div class="card">
<h2>Processos Atracação</h2>
<p id="atracacoes">0</p>
</div>

<div class="card">
<h2>Última Atualização</h2>
<p id="atualizacao" style="font-size:16px;">--</p>
</div>

</div>

<div class="section">
<div class="box">

<h2 style="margin-bottom:15px;">
📦 ITENS PREVISTOS CHEGADA PORTO
</h2>

<input
type="text"
id="buscaItens"
placeholder="Pesquisar produto, código ou marca..."
>

<table id="tabelaItens">
<thead></thead>
<tbody></tbody>
</table>

</div>
</div>

<script>

const csvItens =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRcjCz55sl17I4OMcz2AdS0J915NnR44p6A3is7fy-wcYuY9uh1e3tID0Z37qvsA/pub?gid=26038848&single=true&output=csv';

const csvAtracacao =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRcjCz55sl17I4OMcz2AdS0J915NnR44p6A3is7fy-wcYuY9uh1e3tID0Z37qvsA/pub?gid=1115827490&single=true&output=csv';

async function carregarItens(){

const resposta = await fetch(csvItens);
const texto = await resposta.text();

const linhas = texto.trim().split('\n').map(l=>l.split(','));

const head = linhas[0];
const dados = linhas.slice(1);

document.getElementById('itensPrevistos').innerText =
dados.length;

document.getElementById('atualizacao').innerText =
new Date().toLocaleString('pt-BR');

document.querySelector('#tabelaItens thead').innerHTML =
'<tr>' +
head.map(h=>`<th>${h}</th>`).join('') +
'</tr>';

const tbody =
document.querySelector('#tabelaItens tbody');

function render(filtro=''){

tbody.innerHTML='';

dados
.filter(linha =>
linha.join(' ')
.toLowerCase()
.includes(filtro.toLowerCase())
)
.slice(0,200)
.forEach(linha=>{

const tr=document.createElement('tr');

tr.innerHTML=
linha.map(c=>`<td>${c}</td>`).join('');

tbody.appendChild(tr);

});
}

render();

document
.getElementById('buscaItens')
.addEventListener('input',e=>{
render(e.target.value);
});
}

async function carregarAtracacao(){

const resposta = await fetch(csvAtracacao);
const texto = await resposta.text();

const linhas =
texto.trim().split('\n');

document.getElementById('atracacoes').innerText =
linhas.length - 1;

}

carregarItens();
carregarAtracacao();

</script>

<footer>
Control Tower Importação Distac
</footer>

</body>
</html>
